<style>
/* Layout: one lamp-lit card per clue on a night-stone ground; a slim top bar carries progress, the dawn countdown and language. Single dark look on purpose: it is midnight. */
:root {
  --night: #0e1320;
  --stone: #171e2e;
  --stone-2: #212a3e;
  --line: #2f3a52;
  --parch: #ebe5d6;
  --muted: #a3abbd;
  --lamp: #e9a94f;
  --lamp-deep: #b9772a;
  --ok: #86c99f;
  --bad: #e58b78;
  --display: "Marcellus", "Noto Serif SC", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 600px at 50% -10%, #1c2438 0%, var(--night) 60%) fixed, var(--night);
  color: var(--parch);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--night) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.bar-inner, .wrap {
  max-width: 860px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.brand { font-family: var(--display); font-size: 1.05rem; letter-spacing: .04em; margin-right: auto; white-space: nowrap; }
.dots { display: flex; gap: 6px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--muted); }
.dot.done { background: var(--lamp); border-color: var(--lamp); }
.dot.now { border-color: var(--lamp); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lamp) 25%, transparent); }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 4.5ch; text-align: right; }
.timer.low { color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 10px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--stone-2); color: var(--parch); }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--muted); }
.ghost:hover { color: var(--parch); }

.wrap { padding-block: 28px 64px; display: grid; gap: 20px; }
.card {
  background: linear-gradient(180deg, var(--stone) 0%, color-mix(in srgb, var(--stone) 80%, var(--night)) 100%);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: clamp(20px, 4vw, 36px);
  display: grid; gap: 16px;
  min-width: 0;
}
.ref { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--lamp); margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: clamp(2rem, 6vw, 3.2rem); }
h2 { font-size: clamp(1.5rem, 4vw, 2.1rem); }
p { margin: 0; }
.story { color: var(--parch); max-width: 65ch; }
.task { border-left: 3px solid var(--lamp); padding: 10px 14px; background: color-mix(in srgb, var(--lamp) 8%, transparent); border-radius: 0 8px 8px 0; }
.verse { margin: 0; padding: 14px 18px; background: var(--night); border: 1px solid var(--line); border-radius: 10px; font-size: 1.08rem; display: grid; gap: 8px; }
.verse .src { font-size: .78rem; color: var(--muted); }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--lamp); color: var(--lamp); text-align: center; }

/* multilingual blocks */
.ml { display: grid; gap: 6px; }
.ml > span { display: block; }
.ml > span + span { color: var(--muted); }
.ml > span[lang^="zh"] { font-family: "Noto Sans SC", var(--body); }
h1 .ml > span + span, h2 .ml > span + span { font-size: .62em; }
.verse .ml > span + span { color: var(--parch); opacity: .82; }

form.answer { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
form.answer label { width: 100%; color: var(--muted); font-size: .95rem; }
input[type="text"], select {
  background: var(--night); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0;
}
input[type="text"] { flex: 1 1 220px; font-size: 1.1rem; }
.btn {
  background: var(--lamp); color: #1a1206; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer;
}
.btn:hover { background: color-mix(in srgb, var(--lamp) 85%, white); }
.btn.secondary { background: var(--stone-2); color: var(--parch); border: 1px solid var(--line); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.fb { min-height: 1.4em; font-weight: 500; }
.fb.bad { color: var(--bad); }
.fb.ok { color: var(--ok); }
.solved { border: 1px solid color-mix(in srgb, var(--ok) 50%, var(--line)); background: color-mix(in srgb, var(--ok) 8%, transparent); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.hint { color: var(--muted); font-size: .95rem; }
.hint strong { color: var(--lamp); font-weight: 600; }

/* ordering */
ol.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: o; }
ol.order li {
  counter-increment: o;
  display: grid; grid-template-columns: 2em 1fr auto; gap: 10px; align-items: center;
  background: var(--stone-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
ol.order li::before { content: counter(o); font-family: var(--display); color: var(--lamp); font-size: 1.2rem; text-align: center; }
ol.order .txt { min-width: 0; }
.mv { display: flex; gap: 4px; }
.mv button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--night); cursor: pointer; }
.mv button:disabled { opacity: .3; cursor: default; }
ol.order.locked li { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }

/* maze */
.maze-wrap { overflow-x: auto; }
.maze { display: grid; grid-template-columns: repeat(7, minmax(36px, 52px)); gap: 4px; width: max-content; margin: 0 auto; }
.maze button {
  aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--line); background: var(--stone-2); cursor: pointer; padding: 0;
  font-size: .62rem; line-height: 1.1; color: var(--muted);
}
.maze button.wall { background: #3a3427; border-color: #4a4232; cursor: default;
  background-image: repeating-linear-gradient(0deg, transparent 0 9px, rgba(0,0,0,.25) 9px 10px); }
.maze button.trail { background: color-mix(in srgb, var(--lamp) 22%, var(--stone-2)); }
.maze button.pos { background: var(--lamp); color: #1a1206; font-weight: 700; font-size: 1.1rem; }
.maze button.goal { border: 2px dashed var(--lamp); color: var(--lamp); }
.maze button.near { border-color: var(--lamp); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; color: var(--muted); font-size: .9rem; }

/* cells */
ol.clues { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.cells { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.cell { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
.cell.inner { border-color: color-mix(in srgb, var(--lamp) 45%, var(--line)); }
.cell label { font-size: .85rem; color: var(--muted); }
.cell select { width: 100%; }
@media (max-width: 640px) { .cells { grid-template-columns: 1fr; } }

/* cipher */
.cipher { display: grid; gap: 14px; }
.cipher-row { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.glyphs { font-size: clamp(1.6rem, 5vw, 2.2rem); letter-spacing: .25em; color: var(--lamp); word-break: break-all; }
.glyphs small { font-size: 1rem; letter-spacing: 0; color: var(--parch); }
.key { display: flex; flex-wrap: wrap; gap: 6px; }
.key span { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-variant-numeric: tabular-nums; }
.key span.missing { border-color: var(--bad); color: var(--bad); }

/* intro + end */
.hero { text-align: left; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.rule { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.rule b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.6rem; color: var(--lamp); }
.stats { display: flex; flex-wrap: wrap; gap: 24px; }
.stats b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--lamp); }
.dawn { border: 1px solid var(--lamp); background: color-mix(in srgb, var(--lamp) 12%, var(--stone)); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }

/* leader panel */
.leader { border: 1px dashed var(--lamp-deep); border-radius: 12px; padding: 16px; background: var(--stone); display: grid; gap: 10px; }
.leader table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.leader td, .leader th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.leader .tbl { overflow-x: auto; }
.shield-wrap { position: relative; }
.hidden-answers { filter: blur(9px); user-select: none; pointer-events: none; }
.shield {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 4px; text-align: center;
  background: repeating-linear-gradient(45deg, var(--stone-2) 0 12px, var(--stone) 12px 24px);
  border: 1px solid var(--lamp-deep); border-radius: 10px; cursor: pointer; color: var(--parch);
}
.shield span { font-weight: 600; }
.shield input { width: 12em; flex: 0 1 auto; }
.leader .shield-wrap { min-height: 210px; }
.shield small { color: var(--muted); }

@keyframes glow { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--lamp) 50%, transparent); } to { box-shadow: 0 0 0 18px transparent; } }
.solved { animation: glow 1.2s ease-out 1; }
@media (prefers-reduced-motion: reduce) { .solved { animation: none; } }
</style>

  // ---------- state ----------
  function perm(n) {
    var a, i, j, t, same;
    do {
      a = []; for (i = 0; i < n; i++) a.push(i);
      for (i = n - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
      same = a.every(function (v, k) { return v === k; });
    } while (same);
    return a;
  }
  function fresh(lang) {
    return {
      lang: lang || "all", step: 0, started: null, finished: null, hints: 0,
      shown: {}, solved: {}, dawnSeen: false,
      orders: { accuse: perm(5), quake: perm(5) },
      maze: { pos: [0, 0], trail: ["0,0"] },
      cells: ["", "", "", "", ""],
      leader: false
    };
  }
  function load() {
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  var S = load() || fresh();
  S.reveal = false; // answers always start hidden after a reload

  // ---------- helpers ----------
  function L(o) {
    if (typeof o === "string") return o;
    if (S.lang === "all") {
      return "<span class='ml'>" + LANGS.map(function (l) {
        return "<span lang='" + (l === "zh" ? "zh-Hans" : l) + "'>" + o[l] + "</span>";
      }).join("") + "</span>";
    }
    return o[S.lang];
  }
  function Li(o) { // inline, for buttons and labels
    if (S.lang === "all") return o.en + " · " + o.zh + " · " + o.de;
    return o[S.lang];
  }
  function Lt(o) { return S.lang === "all" ? o.en : o[S.lang]; } // short text (aria)
  function norm(v) {
    return String(v || "").toLowerCase().normalize("NFKC").replace(/[\s\p{P}\p{S}]/gu, "").replace(/ß/g, "ss");
  }
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function elapsed() {
    if (!S.started) return 0;

    }
    $("dots").innerHTML = dots;
    $("dots").setAttribute("aria-label", "Progress: " + Object.keys(S.solved).length + " / " + PUZZLES.length);
    var opts = [["en", "EN"], ["zh", "中文"], ["de", "DE"], ["all", "EN·中·DE"]];
    $("langs").innerHTML = opts.map(function (o) {
      return "<button type='button' data-lang='" + o[0] + "' aria-pressed='" + (S.lang === o[0]) + "'>" + o[1] + "</button>";
    }).join("");

    $("leaderBtn").setAttribute("aria-expanded", String(!!S.leader));
    tick();
  }
  function tick() {
    var left = TOTAL_SEC - elapsed();
    var t = $("timer");
    t.textContent = S.started ? fmt(left) : fmt(TOTAL_SEC);
    t.classList.toggle("low", S.started && !S.finished && left < 5 * 60);
    if (S.started && !S.finished && left <= 0 && !S.dawnSeen) { S.dawnSeen = true; save(); render(); }
  }

      "<blockquote class='verse'><div>" + L(END.v34) + "</div><div class='src'>" + Li({ en: "v.34", zh: "第34节", de: "V. 34" }) + "</div></blockquote>" +
      "<p class='story'>" + L(END.close) + "</p>" +
      "<div class='stats'><div>" + Li(UI.time) + "<b>" + fmt(elapsed()) + "</b></div><div>" + Li(UI.hintsUsed) + "<b>" + S.hints + " / " + MAX_HINTS + "</b></div><div>" +
      Li(UI.clue) + "<b>" + Object.keys(S.solved).length + " / " + PUZZLES.length + "</b></div></div></section>";
  }

  function renderLeader() {
    if (!S.leader) return "";
    var rows = PUZZLES.map(function (p, i) {
      return "<tr><td>" + (i + 1) + "</td><td>" + p.title.en + "</td><td>" + p.answerShow + "</td><td>" + (S.solved[p.id] ? "✓" : "") + "</td></tr>";
    }).join("");
    var canSkip = S.step >= 1 && S.step <= PUZZLES.length && !S.solved[PUZZLES[S.step - 1].id];
    return "<aside class='leader' aria-label='Leader panel'><strong>" + Li(UI.leader) + "</strong>" +
      "<div class='shield-wrap'><div class='tbl" + (S.reveal ? "" : " hidden-answers") + "' aria-hidden='" + (!S.reveal) + "'><table><thead><tr><th>#</th><th>Clue</th><th>Answer</th><th></th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
      (S.reveal ? "" : "<form class='shield' data-act='unlock' autocomplete='off'><span>🔒 Answers hidden</span>" +
        "<label for='leader-word'><small>Leader only · enter the secret word</small></label>" +
        "<div class='row' style='justify-content:center'><input type='password' id='leader-word' autocomplete='off'><button class='btn' type='submit'>Show</button></div>" +
        "<small id='leader-fb' class='fb bad' aria-live='polite'></small></form>") + "</div>" +
      (S.reveal ? "<div><button class='btn secondary' type='button' data-act='hide'>Hide answers</button></div>" : "") +
      (!S.reveal ? "" : "<div class='row'>") + (S.reveal ? "" : "<div class='row' hidden>") +
      (canSkip ? "<button class='btn secondary' type='button' data-act='skip'>Solve this clue for them</button>" : "") +
      (S.confirmReset ? "<button class='btn' type='button' data-act='resetYes'>Yes, reset everything</button><button class='btn secondary' type='button' data-act='resetNo'>Cancel</button>"
                      : "<button class='btn secondary' type='button' data-act='reset'>Reset game</button>") +
      "</div></aside>";
  }

  function render() {
    renderBar();
    var html = renderLeader() + dawnBlock();
    if (S.step === 0) html += renderIntro();
    else if (S.step > PUZZLES.length) html += renderEnd();
    else {
      var p = PUZZLES[S.step - 1], i = S.step - 1;
      html += ({ text: renderText, order: renderOrder, maze: renderMaze, logic: renderLogic, cipher: renderCipher })[p.type](p, i);
    }
    app.innerHTML = html;
    save();
  }

  // ---------- actions ----------
  function current() { return PUZZLES[S.step - 1]; }
  function feedback(msg, ok) {
    var fb = $("fb"); if (!fb) return;
    fb.className = "fb " + (ok ? "ok" : "bad"); fb.innerHTML = msg;
  }
  function solve(p) {
    S.solved[p.id] = true;
    if (Object.keys(S.solved).length === PUZZLES.length && !S.finished) { /* finished on "open the doors" */ }
    render();
    var s = app.querySelector(".solved button"); if (s) s.focus();
  }
  function goNext() {
    S.step += 1;
    if (S.step > PUZZLES.length && !S.finished) S.finished = Date.now();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    var f = app.querySelector("input[type=text], .card button, .card select"); if (f) f.focus({ preventScroll: true });
  }
  function moveMaze(r, c) {
    var p = current(); if (!p || p.type !== "maze" || S.solved[p.id]) return;
    if (r < 0 || c < 0 || r > 6 || c > 6 || MAZE[r][c] === "#" || !isNear(r, c)) return;
    S.maze.pos = [r, c];
    var k = r + "," + c;
    var at = S.maze.trail.indexOf(k);
    if (at >= 0) S.maze.trail = S.maze.trail.slice(0, at + 1); else S.maze.trail.push(k);
    if (r === GOAL[0] && c === GOAL[1]) { solve(p); return; }
    render();
    var b = app.querySelector(".maze .pos"); if (b) b.focus({ preventScroll: true });
  }

  document.addEventListener("click", function (e) {
    var lb = e.target.closest("[data-lang]");
    if (lb) { S.lang = lb.getAttribute("data-lang"); render(); return; }
    if (e.target.closest("#leaderBtn")) { S.leader = !S.leader; S.confirmReset = false; S.reveal = false; render(); return; }
    var b = e.target.closest("[data-act]"); if (!b || b.tagName === "FORM") return;
    var act = b.getAttribute("data-act"), p = current();
    switch (act) {
      case "start": if (!S.started) S.started = Date.now(); S.step = 1; render(); break;
      case "next": goNext(); break;
      case "end": S.dawnSeen = true; S.step = PUZZLES.length + 1; S.finished = S.finished || Date.now(); render(); break;
      case "dismissDawn": S.dawnSeen = "dismissed"; render(); break;
      case "hint":
        if (p && !S.shown[p.id] && S.hints < MAX_HINTS) { S.shown[p.id] = true; S.hints++; render(); }
        break;
      case "up": case "down": {
        var pos = +b.getAttribute("data-pos"), ord = S.orders[p.id], to = act === "up" ? pos - 1 : pos + 1;
        if (to < 0 || to >= ord.length) break;
        var t = ord[pos]; ord[pos] = ord[to]; ord[to] = t; render();
        var again = app.querySelectorAll("[data-act='" + act + "']")[to]; if (again && !again.disabled) again.focus(); break;
      }
      case "checkOrder": {
        var o = S.orders[p.id], right = o.filter(function (v, k) { return v === k; }).length;
        if (right === o.length) solve(p);
        else feedback(right + "/" + o.length + " " + Li(UI.inPlace) + ". " + Li(UI.wrong), false);
        break;
      }
      case "step": moveMaze(+b.getAttribute("data-r"), +b.getAttribute("data-c")); break;
      case "mazeReset": S.maze = { pos: [0, 0], trail: ["0,0"] }; render(); break;
      case "checkCells": {
        var ok = p.solution.every(function (v, k) { return S.cells[k] === v; });
        if (ok) solve(p);
        else {
          var n = p.solution.filter(function (v, k) { return S.cells[k] === v; }).length;
          feedback(n + "/5 " + Li(UI.inPlace) + ". " + Li(UI.wrong), false);
        }
        break;
      }
      case "skip": if (p) solve(p); break;
      case "hide": S.reveal = false; render(); break;
      case "reset": S.confirmReset = true; render(); break;
      case "resetNo": S.confirmReset = false; render(); break;
      case "resetYes": S = fresh(S.lang); render(); break;
    }
  });

  document.addEventListener("change", function (e) {
    var sel = e.target.closest("select[data-cell]");
    if (sel) { S.cells[+sel.getAttribute("data-cell")] = sel.value; save(); }
  });

  document.addEventListener("submit", function (e) {
    var lf = e.target.closest("form[data-act='unlock']");
    if (lf) {
      e.preventDefault();
      if (norm(lf.querySelector("input").value) === norm(LEADER_WORD)) { S.reveal = true; render(); }
      else { $("leader-fb").textContent = "Wrong word"; lf.querySelector("input").select(); }
      return;
    }
    var f = e.target.closest("form[data-act='answer']"); if (!f) return;
    e.preventDefault();
    var p = current(); if (!p) return;
    var v = norm(f.querySelector("input").value);
    if (!v) return;
    var ok = p.answers.some(function (a) { return norm(a) === v; });
    if (ok) solve(p);
    else { feedback(Li(UI.wrong), false); f.querySelector("input").select(); }
  });

  document.addEventListener("keydown", function (e) {
    var p = current();
    if (!p || p.type !== "maze" || S.solved[p.id]) return;
    if (e.target.matches("input, select, textarea")) return;
    var d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!d) return;
    e.preventDefault();
    moveMaze(S.maze.pos[0] + d[0], S.maze.pos[1] + d[1]);
  });

  render();
})();
</script>
