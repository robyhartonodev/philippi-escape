<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnight in Philippi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one lamp-lit card per clue on a night-stone ground; a slim top bar carries progress, the dawn countdown and language. Single dark look on purpose: it is midnight. */
:root {
  --night: #0e1320;
  --stone: #171e2e;
  --stone-2: #212a3e;
  --line: #2f3a52;
  --parch: #ebe5d6;
  --muted: #a3abbd;
  --lamp: #e9a94f;
  --lamp-deep: #b9772a;
  --ok: #86c99f;
  --bad: #e58b78;
  --display: "Marcellus", "Noto Sans SC", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 600px at 50% -10%, #1c2438 0%, var(--night) 60%) fixed, var(--night);
  color: var(--parch);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--night) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.bar-inner, .wrap {
  max-width: 860px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.brand { font-family: var(--display); font-size: 1.05rem; letter-spacing: .04em; margin-right: auto; white-space: nowrap; }
.dots { display: flex; gap: 6px; align-items: center; }
.dot { width: 12px; height: 16px; border-radius: 50% 50% 40% 40%; border: 1px solid var(--muted); }
.dot.done { background: radial-gradient(circle at 50% 35%, #ffe2a8, var(--lamp) 60%); border-color: var(--lamp); box-shadow: 0 0 8px color-mix(in srgb, var(--lamp) 60%, transparent); }
.dot.now { border-color: var(--lamp); }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 4.5ch; text-align: right; }
.timer.low { color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 10px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--stone-2); color: var(--parch); }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--muted); }
.ghost:hover { color: var(--parch); }

.wrap { padding-block: 28px 64px; display: grid; gap: 20px; }
.card {
  background: linear-gradient(180deg, var(--stone) 0%, color-mix(in srgb, var(--stone) 80%, var(--night)) 100%);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: clamp(20px, 4vw, 36px);
  display: grid; gap: 16px;
  min-width: 0;
}
.ref { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--lamp); margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: clamp(2rem, 6vw, 3.2rem); }
h2 { font-size: clamp(1.5rem, 4vw, 2.1rem); }
p { margin: 0; }
.story { max-width: 65ch; }
.task { border-left: 3px solid var(--lamp); padding: 10px 14px; background: color-mix(in srgb, var(--lamp) 8%, transparent); border-radius: 0 8px 8px 0; }
.verse { margin: 0; padding: 14px 18px; background: var(--night); border: 1px solid var(--line); border-radius: 10px; font-size: 1.08rem; display: grid; gap: 8px; }
.verse .src { font-size: .78rem; color: var(--muted); }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--lamp); color: var(--lamp); text-align: center; }

.ml { display: grid; gap: 6px; }
.ml > span { display: block; }
.ml > span + span { color: var(--muted); }
h1 .ml > span + span, h2 .ml > span + span { font-size: .62em; }
.verse .ml > span + span { color: var(--parch); opacity: .82; }
[lang^="zh"] { font-family: "Noto Sans SC", var(--body); }

.btn { background: var(--lamp); color: #1a1206; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
.btn:hover { background: color-mix(in srgb, var(--lamp) 85%, white); }
.btn.secondary { background: var(--stone-2); color: var(--parch); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.fb { min-height: 1.4em; font-weight: 500; }
.fb.bad { color: var(--bad); }
.fb.ok { color: var(--ok); }
.solved { border: 1px solid color-mix(in srgb, var(--ok) 50%, var(--line)); background: color-mix(in srgb, var(--ok) 8%, transparent); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; animation: glow 1.2s ease-out 1; }
.hint { color: var(--muted); font-size: .95rem; }
.hint strong { color: var(--lamp); font-weight: 600; }
.playlang { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: .9rem; }

/* shared tappable piece */
.piece {
  background: var(--stone-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer;
  text-align: left; transition: transform .12s ease, border-color .12s ease, background .12s ease;
}
.piece:hover:not(:disabled) { border-color: var(--lamp); transform: translateY(-1px); }
.piece.sel { border-color: var(--lamp); background: color-mix(in srgb, var(--lamp) 18%, var(--stone-2)); }
.piece.good { border-color: color-mix(in srgb, var(--ok) 60%, var(--line)); background: color-mix(in srgb, var(--ok) 12%, var(--stone-2)); }
.piece:disabled { cursor: default; }
.shake { animation: shake .4s ease 1; }

/* 1 word tiles */
.sentence { min-height: 64px; border: 2px dashed var(--line); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sentence:empty::before { content: attr(data-empty); color: var(--muted); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { font-size: 1.1rem; padding: 8px 14px; }
.tile.used { visibility: hidden; }

/* 2 timeline */
.timeline { display: grid; gap: 8px; }
.timeline .piece { display: grid; grid-template-columns: 2.2em 1fr; gap: 10px; align-items: center; }
.badge { width: 2em; height: 2em; border-radius: 50%; border: 1px dashed var(--muted); display: grid; place-items: center; font-family: var(--display); color: var(--lamp); }
.piece.good .badge { border: 1px solid var(--ok); color: var(--ok); }

/* 3 lost/kept */
.sortlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.sortcard { background: var(--stone-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.sortcard .ico { font-size: 1.5rem; line-height: 1; }
.toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.toggle button { border: 1px solid var(--line); background: var(--night); border-radius: 8px; padding: 6px; cursor: pointer; color: var(--muted); }
.toggle button[aria-pressed="true"].lost { background: color-mix(in srgb, var(--bad) 25%, var(--night)); border-color: var(--bad); color: var(--parch); }
.toggle button[aria-pressed="true"].kept { background: color-mix(in srgb, var(--ok) 25%, var(--night)); border-color: var(--ok); color: var(--parch); }

/* 4 choices */
.sang { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--night); cursor: pointer; }
.sang input { width: 22px; height: 22px; accent-color: var(--lamp); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.choices .piece { text-align: center; font-size: 1.05rem; }

/* 5 earthquake */
.quake { display: grid; gap: 8px; }
.quake .piece { font-size: 1.05rem; }
.quake.rumble .piece { animation: rumble .5s ease 2; }
.quake .piece:nth-child(2n) { margin-left: 18px; }
.quake .piece:nth-child(3n) { margin-left: 6px; }
.quake.locked .piece { margin-left: 0; }

/* 6 prison cells */
.people { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; }
.cells { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.cell { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; min-height: 120px; align-content: start; cursor: pointer; text-align: left; min-width: 0;
  background-image: repeating-linear-gradient(90deg, transparent 0 18px, color-mix(in srgb, var(--line) 60%, transparent) 18px 20px); }
.cell.inner { border-color: color-mix(in srgb, var(--lamp) 45%, var(--line)); }
.cell.target { border-color: var(--lamp); border-style: dashed; }
.cell .lbl { font-size: .8rem; color: var(--muted); }
.cell .who { background: var(--stone-2); border: 1px solid var(--lamp-deep); border-radius: 8px; padding: 6px 8px; font-weight: 600; }
ol.clues { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
@media (max-width: 640px) { .cells { grid-template-columns: 1fr 1fr; } .cell { min-height: 84px; } }

/* 7 decoder */
.decode { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.slot { width: 58px; min-height: 84px; border: 1px solid var(--line); border-radius: 10px; background: var(--night); cursor: pointer; display: grid; grid-template-rows: 1fr 1fr; place-items: center; padding: 6px 0; }
.slot .g { font-size: 1.6rem; color: var(--lamp); }
.slot .v { font-size: 1.3rem; font-weight: 600; min-height: 1.4em; border-bottom: 2px solid var(--line); min-width: 1.4em; text-align: center; }
.slot.sel { border-color: var(--lamp); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lamp) 25%, transparent); }
.tail { font-size: 1.1rem; padding-bottom: 10px; }
.key { display: flex; flex-wrap: wrap; gap: 6px; }
.key span { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.key span.missing { border-color: var(--bad); color: var(--bad); }
.palette { display: flex; flex-wrap: wrap; gap: 6px; }
.palette .piece { min-width: 46px; text-align: center; font-size: 1.15rem; padding: 8px 10px; }

/* intro + end */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.rule { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.rule b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.6rem; color: var(--lamp); }
.stats { display: flex; flex-wrap: wrap; gap: 24px; }
.stats b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--lamp); }
.dawn { border: 1px solid var(--lamp); background: color-mix(in srgb, var(--lamp) 12%, var(--stone)); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.doors { display: flex; justify-content: center; gap: 4px; perspective: 600px; height: 120px; }
.doors span { width: 70px; height: 120px; background: repeating-linear-gradient(90deg, #4a3a24 0 10px, #3a2d1c 10px 12px); border: 2px solid #6b5432; border-radius: 4px; }
.doors span:first-child { transform-origin: left center; animation: openL 1.6s ease .3s forwards; }
.doors span:last-child { transform-origin: right center; animation: openR 1.6s ease .3s forwards; }

/* leader */
.leader { border: 1px dashed var(--lamp-deep); border-radius: 12px; padding: 16px; background: var(--stone); display: grid; gap: 10px; }
.leader table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.leader td, .leader th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.leader .tbl { overflow-x: auto; }
.shield-wrap { position: relative; min-height: 210px; }
.hidden-answers { filter: blur(9px); user-select: none; pointer-events: none; }
.shield { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center;
  background: repeating-linear-gradient(45deg, var(--stone-2) 0 12px, var(--stone) 12px 24px); border: 1px solid var(--lamp-deep); border-radius: 10px; }
.shield span { font-weight: 600; }
.shield small { color: var(--muted); }
.shield input { width: 12em; background: var(--night); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }

@keyframes glow { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--lamp) 50%, transparent); } to { box-shadow: 0 0 0 18px transparent; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes rumble { 0%,100% { transform: translate(0,0) rotate(0); } 20% { transform: translate(-3px,1px) rotate(-1deg); } 40% { transform: translate(3px,-1px) rotate(1deg); } 60% { transform: translate(-2px,2px); } 80% { transform: translate(2px,-1px) rotate(.5deg); } }
@keyframes openL { to { transform: rotateY(-75deg); } }
@keyframes openR { to { transform: rotateY(75deg); } }
@media (prefers-reduced-motion: reduce) { .solved, .shake, .quake.rumble .piece, .doors span { animation: none !important; } }
</style>

</header>
<main class="wrap" id="app"></main>

  var R = {};

  R.tiles = function (p, i) {
    var t = p.tiles[PL()], all = t.good.concat(t.bad), order = S.tilePerm[PL()], done = !!S.solved[p.id];
    var built = S.picked.map(function (k, pos) {
      return "<button type='button' class='piece tile" + (done ? " good" : "") + "' data-act='unpick' data-pos='" + pos + "' lang='" + lng(PL()) + "'" + (done ? " disabled" : "") + ">" + all[k] + "</button>";
    }).join("");
    var pool = order.map(function (k) {
      var used = S.picked.indexOf(k) >= 0;
      return "<button type='button' class='piece tile" + (used ? " used" : "") + "' data-act='pick' data-k='" + k + "' lang='" + lng(PL()) + "'" + (used || done ? " disabled" : "") + ">" + all[k] + "</button>";
    }).join("");
    var body = playLangPicker() +
      "<div class='sentence' id='sentence' data-empty='…'>" + built + "</div>" +
      (done ? "" : "<div class='pool'>" + pool + "</div><div class='row'><button class='btn' type='button' data-act='checkTiles'>" + Li(UI.check) + "</button>" +
        "<button class='btn secondary' type='button' data-act='clearTiles'>" + Li(UI.clear) + "</button></div>");
    return wrap(p, i, body, done ? "" : fbLine());
  };

  R.timeline = function (p, i) {
    var done = !!S.solved[p.id];
    var list = S.tlOrder.map(function (k) {
      var found = k < S.tlFound;
      return "<button type='button' class='piece" + (found ? " good" : "") + "' data-act='tl' data-k='" + k + "'" + (found || done ? " disabled" : "") + ">" +
        "<span class='badge'>" + (found ? (k + 1) : "") + "</span><span>" + L(p.items[k]) + "</span></button>";
    }).join("");
    return wrap(p, i, "<div class='timeline'>" + list + "</div>", done ? "" : fbLine());
  };

  R.sort = function (p, i) {
    var done = !!S.solved[p.id];
    var cards = S.sortOrder.map(function (k) {
      var c = p.cards[k], v = S.sort[k];
      return "<div class='sortcard'><div class='row'><span class='ico' aria-hidden='true'>" + c.ico + "</span><div>" + L(c) + "</div></div>" +
        "<div class='toggle'><button type='button' class='lost' data-act='sortSet' data-k='" + k + "' data-v='lost' aria-pressed='" + (v === "lost") + "'" + (done ? " disabled" : "") + ">" + Li(UI.lost) + "</button>" +
        "<button type='button' class='kept' data-act='sortSet' data-k='" + k + "' data-v='kept' aria-pressed='" + (v === "kept") + "'" + (done ? " disabled" : "") + ">" + Li(UI.kept) + "</button></div></div>";
    }).join("");
    var all = Object.keys(S.sort).length === p.cards.length;
    return wrap(p, i, "<div class='sortlist'>" + cards + "</div>" +
      (done ? "" : "<div class='row'><button class='btn' type='button' data-act='checkSort'" + (all ? "" : " disabled") + ">" + Li(UI.check) + "</button></div>"), done ? "" : fbLine());
  };

  R.choice = function (p, i) {
    var done = !!S.solved[p.id];
    var verse = {}; LANGS.forEach(function (l) { verse[l] = p.verse[l].replace("{x}", done ? p.fill[l] : "?"); });
    var opts = p.options.map(function (o, k) {
      var bad = S.choiceWrong === k;
      return "<button type='button' class='piece" + (done && o.ok ? " good" : "") + (bad ? " shake" : "") + "' data-act='choose' data-k='" + k + "'" + (!S.sang || done ? " disabled" : "") + ">" + L(o) + "</button>";
    }).join("");
    var why = S.choiceWrong != null && !done ? L(p.options[S.choiceWrong].why) : "";
    var body = "<label class='sang' for='sang'><input type='checkbox' id='sang' data-act='sang'" + (S.sang ? " checked" : "") + (done ? " disabled" : "") + "> <span>" + L(p.sangLabel) + " 🎵</span></label>" +
      "<blockquote class='verse'><div>" + L(verse) + "</div><div class='src'>" + Li(p.src) + "</div></blockquote>" +
      "<div class='choices'>" + opts + "</div>";
    return wrap(p, i, body, done ? "" : fbLine(why, false));
  };

  R.swap = function (p, i) {
    var done = !!S.solved[p.id];
    var right = S.quake.filter(function (v, k) { return v === k; }).length;
    var list = S.quake.map(function (k, pos) {
      return "<button type='button' class='piece" + (S.quakeSel === pos ? " sel" : "") + (done ? " good" : "") + "' data-act='qswap' data-pos='" + pos + "'" + (done ? " disabled" : "") + ">" + L(p.items[k]) + "</button>";
    }).join("");
    var cls = "quake" + (done ? " locked" : "") + (S.rumble ? " rumble" : "");
    S.rumble = false;
    return wrap(p, i, "<div class='" + cls + "'>" + list + "</div>", done ? "" : fbLine(right + "/5 " + Li(UI.inPlace), right === 5));
  };

  R.place = function (p, i) {
    var done = !!S.solved[p.id];
    var nameOf = function (id) { var pe = p.people.filter(function (x) { return x.id === id; })[0]; return pe ? Li(pe) : ""; };
    var waiting = p.people.filter(function (pe) { return S.cells.indexOf(pe.id) < 0; }).map(function (pe) {
      return "<button type='button' class='piece" + (S.selPerson === pe.id ? " sel" : "") + "' data-act='person' data-id='" + pe.id + "'>👤 " + Li(pe) + "</button>";
    }).join("");
    var cells = p.cellNames.map(function (nm, k) {
      var who = S.cells[k];
      return "<button type='button' class='cell" + (k >= 3 ? " inner" : "") + (S.selPerson && !done ? " target" : "") + "' data-act='cell' data-k='" + k + "'" + (done ? " disabled" : "") + ">" +
        "<span class='lbl'>" + Li(nm) + "</span>" + (who ? "<span class='who'>" + nameOf(who) + "</span>" : "") + "</button>";
    }).join("");
    var body = "<ol class='clues'>" + p.clues.map(function (c) { return "<li>" + L(c) + "</li>"; }).join("") + "</ol>" +
      (done ? "" : "<div class='people'>" + waiting + "</div>") +
      "<div class='cells'>" + cells + "</div>" +
      (done ? "" : "<div class='row'><button class='btn' type='button' data-act='checkCells'" + (S.cells.every(Boolean) ? "" : " disabled") + ">" + Li(UI.check) + "</button></div>");
    return wrap(p, i, body, done ? "" : fbLine());
  };

  R.decode = function (p, i) {
    var done = !!S.solved[p.id], c = p.cipher[PL()], map = S.decode[PL()] || {};
    var slots = c.glyphs.map(function (g, k) {
      return "<button type='button' class='slot" + (S.selGlyph === g && !done ? " sel" : "") + "' data-act='glyph' data-g='" + g + "'" + (done ? " disabled" : "") + " aria-label='symbol " + (k + 1) + "'>" +
        "<span class='g'>" + g + "</span><span class='v' lang='" + lng(PL()) + "'>" + (map[g] || "") + "</span></button>";
    }).join("");
    var key = c.key.map(function (k) { return "<span class='" + (k[1] === "?" ? "missing" : "") + "'>" + k[0] + " = " + k[1] + "</span>"; }).join("");
    var pal = c.palette.map(function (ch) {
      return "<button type='button' class='piece' data-act='letter' data-ch='" + ch + "' lang='" + lng(PL()) + "'" + (!S.selGlyph || done ? " disabled" : "") + ">" + ch + "</button>";
    }).join("");
    var body = playLangPicker() +
      "<div class='decode' lang='" + lng(PL()) + "'>" + slots + "<span class='tail'>" + c.tail + "</span></div>" +
      "<div class='hint'>" + Li(UI.key) + "</div><div class='key'>" + key + "</div>" +
      (done ? "" : "<div class='palette'>" + pal + "</div>");
    return wrap(p, i, body, done ? "" : fbLine());
  };

  function renderIntro() {
    return "<section class='card'><p class='ref'>" + Li(INTRO.ref) + "</p><h1>" + L(UI.title) + "</h1><p class='story'>" + L(INTRO.story) + "</p>" +
      "<div class='rules'><div class='rule'><b>7</b>" + L(INTRO.r1) + "</div><div class='rule'><b>50</b>" + L(INTRO.r2) + "</div>" +
      "<div class='rule'><b>3</b>" + L(INTRO.r3) + "</div><div class='rule'><b>EN·中·DE</b>" + L(INTRO.r4) + "</div></div>" +
      "<div><button class='btn' type='button' data-act='start'>" + Li(UI.start) + " →</button></div></section>";
  }
  function renderEnd() {
    return "<section class='card'><div class='doors' aria-hidden='true'><span></span><span></span></div><p class='ref'>" + Li(END.ref) + "</p><h1>" + L(END.title) + "</h1>" +
      "<blockquote class='verse'><div>" + L(END.v31) + "</div><div class='src'>" + Li({ en: "v.31", zh: "第31节", de: "V. 31" }) + "</div></blockquote>" +
      "<blockquote class='verse'><div>" + L(END.v34) + "</div><div class='src'>" + Li({ en: "v.34", zh: "第34节", de: "V. 34" }) + "</div></blockquote>" +
      "<p class='story'>" + L(END.close) + "</p>" +
      "<div class='stats'><div>" + Li(UI.time) + "<b>" + fmt(elapsed()) + "</b></div><div>" + Li(UI.hintsUsed) + "<b>" + S.hints + " / " + MAX_HINTS + "</b></div><div>" +
      Li(UI.clue) + "<b>" + Object.keys(S.solved).length + " / " + PUZZLES.length + "</b></div></div></section>";
  }
  function renderDawn() {
    if (S.dawnSeen !== true || S.finished) return "";
    return "<div class='dawn' role='alert'><div>" + L(UI.dawn) + "</div><div class='row'><button class='btn' type='button' data-act='end'>" + Li(UI.finish) +
      "</button><button class='btn secondary' type='button' data-act='dismissDawn'>" + Li(UI.keepGoing) + "</button></div></div>";
  }
  function renderLeader() {
    if (!S.leader) return "";
    var rows = PUZZLES.map(function (p, i) { return "<tr><td>" + (i + 1) + "</td><td>" + p.title.en + "</td><td>" + p.answerShow + "</td><td>" + (S.solved[p.id] ? "✓" : "") + "</td></tr>"; }).join("");
    var canSkip = S.step >= 1 && S.step <= PUZZLES.length && !S.solved[PUZZLES[S.step - 1].id];
    var html = "<aside class='leader' aria-label='Leader panel'><strong>" + Li(UI.leader) + "</strong><div class='shield-wrap'>" +
      "<div class='tbl" + (S.reveal ? "" : " hidden-answers") + "' aria-hidden='" + (!S.reveal) + "'><table><thead><tr><th>#</th><th>Clue</th><th>Answer</th><th></th></tr></thead><tbody>" + rows + "</tbody></table></div>";
    if (!S.reveal) {
      html += "<form class='shield' data-act='unlock' autocomplete='off'><span>🔒 Answers hidden</span><label for='leader-word'><small>Leader only · enter the secret word</small></label>" +
        "<div class='row' style='justify-content:center'><input type='password' id='leader-word' autocomplete='off'><button class='btn' type='submit'>Show</button></div>" +
        "<small id='leader-fb' class='fb bad' aria-live='polite'></small></form></div></aside>";
      return html;
    }
    return html + "</div><div class='row'><button class='btn secondary' type='button' data-act='hide'>Hide answers</button>" +
      (canSkip ? "<button class='btn secondary' type='button' data-act='skip'>Solve this clue for them</button>" : "") +
      (S.confirmReset ? "<button class='btn' type='button' data-act='resetYes'>Yes, reset everything</button><button class='btn secondary' type='button' data-act='resetNo'>Cancel</button>"
                      : "<button class='btn secondary' type='button' data-act='reset'>Reset game</button>") + "</div></aside>";
  }

  function render() {
    renderBar();
    var html = renderLeader() + renderDawn();
    if (S.step === 0) html += renderIntro();
    else if (S.step > PUZZLES.length) html += renderEnd();
    else { var p = PUZZLES[S.step - 1]; html += R[p.type](p, S.step - 1); }
    app.innerHTML = html;
    if (flash) { var el = app.querySelector(flash.sel); if (el) { el.classList.remove(flash.cls); void el.offsetWidth; el.classList.add(flash.cls); } flash = null; }
    save();
  }

  // ---------- actions ----------
  function cur() { return PUZZLES[S.step - 1]; }
  function fb(msg, ok) { var f = $("fb"); if (f) { f.className = "fb " + (ok ? "ok" : "bad"); f.innerHTML = msg; } }
  function solve(p) {
    S.solved[p.id] = true; S.choiceWrong = null; S.selGlyph = null; S.selPerson = null; S.quakeSel = null;
    render();
    var b = app.querySelector(".solved button"); if (b) b.focus({ preventScroll: false });
  }
  function goNext() {
    S.step += 1;
    if (S.step > PUZZLES.length && !S.finished) S.finished = Date.now();
    if (cur() && cur().type === "swap") S.rumble = true;
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  }

  document.addEventListener("click", function (e) {
    var lb = e.target.closest("[data-lang]");
    if (lb) { S.lang = lb.getAttribute("data-lang"); render(); return; }
    var pb = e.target.closest("[data-play]");
    if (pb) { var nl = pb.getAttribute("data-play"); if (nl !== S.playLang) { S.playLang = nl; S.picked = []; S.selGlyph = null; } render(); return; }
    if (e.target.closest("#leaderBtn")) { S.leader = !S.leader; S.confirmReset = false; S.reveal = false; render(); return; }
    var b = e.target.closest("[data-act]"); if (!b || b.tagName === "FORM" || b.disabled) return;
    var act = b.getAttribute("data-act"), p = cur();
    switch (act) {
      case "start": if (!S.started) S.started = Date.now(); S.step = 1; render(); break;
      case "next": goNext(); break;
      case "end": S.step = PUZZLES.length + 1; S.finished = S.finished || Date.now(); render(); break;
      case "dismissDawn": S.dawnSeen = "dismissed"; render(); break;
      case "hint": if (p && !S.shown[p.id] && S.hints < MAX_HINTS) { S.shown[p.id] = true; S.hints++; render(); } break;

      // 1 tiles
      case "pick": S.picked.push(+b.getAttribute("data-k")); render(); break;
      case "unpick": S.picked.splice(+b.getAttribute("data-pos"), 1); render(); break;
      case "clearTiles": S.picked = []; render(); break;
      case "checkTiles": {
        var good = p.tiles[PL()].good.length;
        var ok = S.picked.length === good && S.picked.every(function (k, pos) { return k === pos; });
        if (ok) solve(p);
        else { flash = { sel: "#sentence", cls: "shake" }; render(); fb(Li(UI.wrong), false); }
        break;
      }

      // 2 timeline
      case "tl": {
        var k = +b.getAttribute("data-k");
        if (k === S.tlFound) { S.tlFound++; if (S.tlFound === p.items.length) solve(p); else render(); }
        else { flash = { sel: "[data-act='tl'][data-k='" + k + "']", cls: "shake" }; render(); fb(Li(UI.wrong), false); }
        break;
      }

      // 3 sort
      case "sortSet": S.sort[b.getAttribute("data-k")] = b.getAttribute("data-v"); render(); break;
      case "checkSort": {
        var right = p.cards.filter(function (c, k) { return S.sort[k] === c.ans; }).length;
        if (right === p.cards.length) solve(p);
        else { render(); fb(right + "/" + p.cards.length + " " + Li(UI.sorted) + ". " + Li(UI.wrong), false); }
        break;
      }

      // 4 choice
      case "choose": {
        var k4 = +b.getAttribute("data-k");
        if (p.options[k4].ok) solve(p); else { S.choiceWrong = k4; render(); }
        break;
      }

      // 5 swap
      case "qswap": {
        var pos = +b.getAttribute("data-pos");
        if (S.quakeSel === null) S.quakeSel = pos;
        else if (S.quakeSel === pos) S.quakeSel = null;
        else { var t = S.quake[pos]; S.quake[pos] = S.quake[S.quakeSel]; S.quake[S.quakeSel] = t; S.quakeSel = null; }
        if (S.quake.every(function (v, i) { return v === i; })) solve(p); else render();
        break;
      }

      // 6 place
      case "person": { var id = b.getAttribute("data-id"); S.selPerson = S.selPerson === id ? null : id; render(); break; }
      case "cell": {
        var c = +b.getAttribute("data-k");
        if (S.selPerson) { var old = S.cells.indexOf(S.selPerson); if (old >= 0) S.cells[old] = ""; S.cells[c] = S.selPerson; S.selPerson = null; }
        else if (S.cells[c]) { S.cells[c] = ""; } // tap a filled cell to send that person back
        render(); break;
      }
      case "checkCells": {
        var n = p.solution.filter(function (v, k) { return S.cells[k] === v; }).length;
        if (n === 5) solve(p); else { render(); fb(n + "/5 " + Li(UI.inPlace) + ". " + Li(UI.wrong), false); }
        break;
      }

      // 7 decode
      case "glyph": { var g = b.getAttribute("data-g"); S.selGlyph = S.selGlyph === g ? null : g; render(); break; }
      case "letter": {
        if (!S.selGlyph) break;
        var m = S.decode[PL()] = S.decode[PL()] || {};
        m[S.selGlyph] = b.getAttribute("data-ch"); S.selGlyph = null;
        var ci = p.cipher[PL()], word = Array.from(ci.word);
        var filled = ci.glyphs.every(function (gl) { return m[gl]; });
        var okw = ci.glyphs.every(function (gl, k) { return m[gl] === word[k]; });
        if (okw) solve(p);
        else { render(); if (filled) fb(Li(UI.wrong), false); }
        break;
      }

      // leader
      case "hide": S.reveal = false; render(); break;
      case "skip": if (p) solve(p); break;
      case "reset": S.confirmReset = true; render(); break;
      case "resetNo": S.confirmReset = false; render(); break;
      case "resetYes": S = fresh(S.lang); S.leader = true; S.reveal = true; render(); break;
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target.id === "sang") { S.sang = e.target.checked; S.choiceWrong = null; render(); }
  });

  document.addEventListener("submit", function (e) {
    var lf = e.target.closest("form[data-act='unlock']"); if (!lf) return;
    e.preventDefault();
    var v = lf.querySelector("input").value.trim().toLowerCase();
    if (v === LEADER_WORD.toLowerCase()) { S.reveal = true; render(); }
    else { $("leader-fb").textContent = "Wrong word"; lf.querySelector("input").select(); }
  });

  render();
})();
</script>
